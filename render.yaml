services:
  - type: web
    name: gameclub-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn webapp:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: DB_PATH
        value: /opt/render/project/src/gameclub.db
    healthCheckPath: /
